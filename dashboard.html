<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mr_crab 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { --bg:#14171c; --panel:#1d2128; --line:#2b313b; --fg:#e6e9ee; --dim:#8b93a1; --acc:#4fb3ff; --warn:#ffb454; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; gap:10px; padding:10px; }
  .top { display:flex; gap:10px; flex:1 1 0; min-height:0; overflow:auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  h2 { margin:0 0 8px; font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; display:flex; justify-content:space-between; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-right:6px; }
  .dot.on { background:#4ade80; }
  #joints { flex:1 1 380px; }
  #cam { flex:1 1 380px; display:flex; flex-direction:column; }
  #cam .frame { flex:1; display:flex; align-items:center; justify-content:center; background:#000; border-radius:4px; min-height:200px; position:relative; }
  #cam img { max-width:100%; max-height:calc(50vh - 90px); display:block; }
  #cam .nosig { position:absolute; color:var(--dim); }
  .row { display:grid; grid-template-columns:70px 1fr 150px; gap:10px; align-items:center; margin:7px 0; }
  .row .name { color:var(--dim); }
  .bar { position:relative; height:10px; background:#10131800; border:1px solid var(--line); border-radius:5px; }
  .bar i { position:absolute; top:-1px; width:3px; height:10px; background:var(--acc); border-radius:2px; transform:translateX(-50%); }
  .bar b { position:absolute; left:50%; top:0; width:1px; height:100%; background:var(--line); }
  .bar input[type=range] { position:absolute; left:-6px; width:calc(100% + 12px); top:-4px; height:18px; margin:0; background:none;
                           -webkit-appearance:none; appearance:none; }
  .bar input[type=range]::-webkit-slider-runnable-track { background:none; height:18px; }
  .bar input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:18px; margin-top:0; border-radius:4px;
                           background:var(--warn); border:1px solid #0006; cursor:pointer; }
  .bar input[type=range]:disabled::-webkit-slider-thumb { background:#4a5160; cursor:default; }
  .bar i { z-index:1; pointer-events:none; }
  .num { width:62px; background:#10131800; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px;
         font:inherit; font-family:ui-monospace, monospace; text-align:right; }
  .num:disabled { opacity:.5; }
  .ctl { display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .ctl label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  button { background:#2a303a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  button.stop { background:#6b2a2a; border-color:#a44; }
  #msg { color:var(--dim); font-size:12px; margin-left:auto; }
  #msg.err { color:var(--warn); }
  .val { text-align:right; font-variant-numeric:tabular-nums; font-family:ui-monospace, monospace; }
  .val small { color:var(--dim); }
  #termwrap { flex:0 0 50%; max-height:50%; min-height:0; display:flex; flex-direction:column; }   /* 창 높이의 절반 */
  #term { flex:1; min-height:0; }
  @media (max-width: 900px) { .top { flex-direction:column; } }
</style>
</head>
<body>
<div class="top">
  <div class="panel" id="joints">
    <h2><span>관절 각도</span><span><span class="dot" id="dot"></span><span id="status">연결 중…</span></span></h2>
    <div id="rows"></div>
    <div class="ctl">
      <label><input type="checkbox" id="en"> 제어 활성화</label>
      <button id="home" disabled>홈 자세</button>
      <button id="stop" class="stop">정지</button>
      <span id="msg"></span>
    </div>
  </div>
  <div class="panel" id="cam">
    <h2><span>카메라 (/camera1/image_raw)</span><span id="fps"></span></h2>
    <div class="frame"><img id="img" alt=""><span class="nosig" id="nosig">신호 없음</span></div>
  </div>
</div>
<div class="panel" id="termwrap">
  <h2><span>터미널 (~/mr_crab_ws)</span><span id="tstat"></span></h2>
  <div id="term"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const wsBase = `ws://${location.host}`;

// ── 관절 ──  [표시 이름, 하한(rad), 상한(rad)]
const JOINTS = {
  joint1: ['joint1', -3.14, 3.14],
  joint2: ['joint2', -1.5, 1.5],
  joint3: ['joint3', -1.5, 1.4],
  joint4: ['joint4', -1.7, 1.97],
  gripper_left_joint: ['gripper', -0.01, 0.019],
};
const rows = document.getElementById('rows');
const els = {};
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const isGrip = (k) => k.startsWith('gripper');
const HOLD_MS = 6000;   // 명령을 보낸 뒤 이 시간 동안은 슬라이더를 실제 위치로 되돌리지 않는다
for (const [k, [label, lo, hi]] of Object.entries(JOINTS)) {
  const d = document.createElement('div');
  d.className = 'row';
  const step = isGrip(k) ? 0.0005 : 0.5 * D2R;
  d.innerHTML = `<span class="name">${label}</span>
    <div class="bar"><b></b><i style="left:50%"></i>
      <input type="range" min="${lo}" max="${hi}" step="${step}" value="${(lo + hi) / 2}" disabled></div>
    <span class="val"><input class="num" type="number" disabled step="${isGrip(k) ? 0.5 : 1}"
      min="${isGrip(k) ? lo * 1000 : lo * R2D}" max="${isGrip(k) ? hi * 1000 : hi * R2D}"> <small>${isGrip(k) ? 'mm' : '°'}</small>
      <small class="rad"></small></span>`;
  rows.appendChild(d);
  els[k] = { bar: d.querySelector('i'), slider: d.querySelector('input[type=range]'),
             num: d.querySelector('.num'), rad: d.querySelector('.rad'), hold: 0, drag: false };
}
const toDisp = (k, p) => isGrip(k) ? p * 1000 : p * R2D;
const fromDisp = (k, v) => isGrip(k) ? v / 1000 : v * D2R;
let actual = {};
function showJoints(j) {
  actual = j;
  for (const [k, [, lo, hi]] of Object.entries(JOINTS)) {
    if (!(k in j)) continue;
    const e = els[k], p = j[k][0];
    e.bar.style.left = Math.max(0, Math.min(100, (p - lo) / (hi - lo) * 100)) + '%';
    e.rad.textContent = isGrip(k) ? '' : p.toFixed(3);
    // 사용자가 만지는 중이거나 방금 명령을 보냈으면 목표값(슬라이더)을 그대로 두고, 아니면 실제 위치를 따라간다
    if (!e.drag && Date.now() > e.hold && document.activeElement !== e.num) {
      e.slider.value = p;
      e.num.value = toDisp(k, p).toFixed(isGrip(k) ? 1 : 1);
    }
  }
}

// ── 제어 ──
let wsCtl = null, locked = false;
const en = document.getElementById('en'), msgEl = document.getElementById('msg');
const homeBtn = document.getElementById('home'), stopBtn = document.getElementById('stop');
function refreshEnabled() {
  const on = en.checked && !locked;
  for (const e of Object.values(els)) { e.slider.disabled = !on; e.num.disabled = !on; }
  homeBtn.disabled = !on;
}
en.addEventListener('change', refreshEnabled);
function sendCmd(o) { if (wsCtl && wsCtl.readyState === 1) wsCtl.send(JSON.stringify(o)); }
function sendJoint(k) {
  const e = els[k];
  e.hold = Date.now() + HOLD_MS;
  if (isGrip(k)) sendCmd({ cmd: 'gripper', position: parseFloat(e.slider.value) });
  else sendCmd({ cmd: 'move', joints: { [k]: parseFloat(e.slider.value) } });   // 나머지 관절은 서버가 현재 위치로 유지
}
for (const [k, e] of Object.entries(els)) {
  e.slider.addEventListener('pointerdown', () => { e.drag = true; });
  e.slider.addEventListener('input', () => { e.num.value = toDisp(k, parseFloat(e.slider.value)).toFixed(1); });
  e.slider.addEventListener('change', () => { e.drag = false; sendJoint(k); });   // 손을 뗄 때 한 번만 전송
  window.addEventListener('pointerup', () => { e.drag = false; });
  e.num.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    const v = parseFloat(e.num.value);
    if (!isFinite(v)) return;
    e.slider.value = fromDisp(k, v);   // range가 한계로 클램프해 준다
    e.num.value = toDisp(k, parseFloat(e.slider.value)).toFixed(1);
    sendJoint(k);
    e.num.blur();
  });
}
homeBtn.addEventListener('click', () => {
  for (const e of Object.values(els)) e.hold = Date.now() + HOLD_MS * 2;
  sendCmd({ cmd: 'home' });
});
stopBtn.addEventListener('click', () => {   // 정지는 제어 비활성 상태에서도 항상 가능
  for (const e of Object.values(els)) e.hold = 0;
  sendCmd({ cmd: 'stop' });
});
let msgTimer = null;
function showMsg(ok, text) {
  msgEl.textContent = text; msgEl.className = ok ? '' : 'err';
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { msgEl.textContent = ''; }, 4000);
}

// ── 상태 + 영상 웹소켓 ──
const img = document.getElementById('img'), nosig = document.getElementById('nosig');
const dot = document.getElementById('dot'), status = document.getElementById('status'), fpsEl = document.getElementById('fps');
let frames = 0, lastUrl = null, lastFrame = 0;
function connect() {
  const ws = new WebSocket(`${wsBase}/ws?t=${token}`);
  ws.binaryType = 'blob';
  ws.onopen = () => { wsCtl = ws; dot.classList.add('on'); status.textContent = '연결됨'; };
  ws.onclose = () => { wsCtl = null; dot.classList.remove('on'); status.textContent = '재연결 중…'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.result) { showMsg(m.result.ok, m.result.msg); return; }
      if (m.locked !== locked) { locked = m.locked; refreshEnabled(); if (locked) showMsg(false, '종료 중 — 제어 잠김'); }
      showJoints(m.joints);
      return;
    }
    // 이전 프레임 URL은 새 프레임을 넣기 전에 바로 해제한다. (onload에서 해제하면, 로드가 끝나기 전에 다음 프레임이
    //  오는 경우 그 URL이 영영 해제되지 않아 오래 켜 두면 메모리가 계속 늘어난다)
    const url = URL.createObjectURL(e.data);
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    img.src = url; nosig.style.display = 'none'; frames++; lastFrame = Date.now();
  };
}
connect();
setInterval(() => {
  fpsEl.textContent = frames ? frames + ' fps' : '';
  frames = 0;
  if (Date.now() - lastFrame > 2000) nosig.style.display = '';
}, 1000);

// ── 터미널 ──
const term = new Terminal({ fontFamily: 'ui-monospace, "DejaVu Sans Mono", monospace', fontSize: 18, cursorBlink: true,
                            theme: { background: '#0e1014' } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
const tstat = document.getElementById('tstat');
function connectTerm() {
  const ws = new WebSocket(`${wsBase}/term?t=${token}`);
  ws.binaryType = 'arraybuffer';
  const enc = new TextEncoder();
  const sendSize = () => ws.readyState === 1 && ws.send(JSON.stringify({ resize: [term.cols, term.rows] }));
  ws.onopen = () => { tstat.textContent = ''; fit.fit(); sendSize(); term.focus(); };
  ws.onmessage = (e) => term.write(new Uint8Array(e.data));
  ws.onclose = () => { tstat.textContent = '터미널 종료됨 — 새로고침하면 다시 연결'; };
  term.onData((d) => ws.readyState === 1 && ws.send(enc.encode(d)));
  term.onResize(sendSize);
}
connectTerm();
new ResizeObserver(() => fit.fit()).observe(document.getElementById('term'));
window.addEventListener('load', () => fit.fit());
</script>
</body>
</html>
